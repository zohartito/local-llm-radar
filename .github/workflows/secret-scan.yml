name: secret-scan

# No marketplace actions: the repo is cloned with git directly and gitleaks
# is a pinned, checksum-verified release binary, so no mutable third-party
# code ever executes with the workflow token. Bump VERSION and SHA256 together.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A plain fetch of the SHA brings its full history, which is what
          # lets gitleaks scan every commit on this ref.
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q "$GITHUB_SHA"

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Run gitleaks over full history
        run: ./gitleaks git --redact --no-banner .
